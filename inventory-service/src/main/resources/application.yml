spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:mysql://mysql:3306/orders
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

#  flyway:
#    enabled: true
#    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:app_password}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
