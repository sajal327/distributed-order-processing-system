server:
  port: 8080

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://mysql:3306/notification_db
    username: app
    password: app_password

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: app
    password: app_password

management:
  endpoints:
    web:
      exposure:
        include: health,info